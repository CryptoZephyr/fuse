name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: default

jobs:
  contracts:
    name: Contracts (Build, Unit, Fuzz & Mezo Testnet Fork)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check Solidity formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: forge build --sizes

      - name: Run unit & fuzz tests
        working-directory: contracts
        run: forge test --no-match-path "test/FuseRouter.fork.t.sol" -vv

      - name: Run Mezo testnet fork tests
        working-directory: contracts
        run: forge test --match-path "test/FuseRouter.fork.t.sol" --fork-url https://rpc.test.mezo.org -vv

  workspace:
    name: Workspace Packages (SDK & Web Widget)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace packages
        run: pnpm build

      - name: Typecheck workspace packages
        run: pnpm typecheck

      - name: Run SDK & Widget tests
        run: pnpm test:packages
